name: Deploy

# 在 GitHub 的機器上 build，主機端只 pull。
# 遠振 TW-VPS-S 只有 4GB，next build 尖峰要 3-4GB，在那台機器上 build 會 OOM。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # 同一分支同時只跑一次部署，避免兩次推送互相覆蓋
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Dockerfile 的 stage 名稱 → image 後綴
        include:
          - target: runner
            suffix: web
          - target: worker
            suffix: worker
          - target: migrate
            suffix: migrate

    steps:
      - uses: actions/checkout@v4

      - name: 計算 image 名稱（GHCR 只吃小寫）
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到主機拉新版並重啟
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/sagon

            # GHCR 私有套件需要登入才能 pull。
            # GHCR_TOKEN 用一個只有 read:packages 權限的 PAT，別放有寫入權的。
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            # migrate 是一次性容器，compose 會等它跑完才起 web/worker
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 舊 image 會累積，50GB 的磁碟撐不了幾十次部署
            docker image prune -af --filter "until=168h"

            docker compose -f docker-compose.prod.yml ps
