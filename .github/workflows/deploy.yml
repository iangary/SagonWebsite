name: Build images

# 這個 workflow 只負責 build image 並推到 GHCR，**不做部署**。
# 部署是手動的：主機上 pull 再 up，步驟見 docs/deploy.md 第 7 節。
#
# 為什麼一定要在 GitHub 的機器上 build：遠振 TW-VPS-S 只有 4GB，
# next build 尖峰要 3-4GB，在那台機器上 build 會被 OOM killer 砍掉。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # 同一分支同時只跑一次，避免兩次推送互相覆蓋 latest tag
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Dockerfile 的 stage 名稱 → image 後綴
        include:
          - target: runner
            suffix: web
          - target: worker
            suffix: worker
          - target: migrate
            suffix: migrate

    steps:
      - uses: actions/checkout@v4

      - name: 計算 image 名稱（GHCR 只吃小寫）
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: 印出主機端要跑的指令
        run: |
          echo "image 已推上 GHCR。到主機執行："
          echo "  cd /srv/sagon"
          echo "  docker compose -f docker-compose.prod.yml pull"
          echo "  docker compose -f docker-compose.prod.yml up -d"
          echo "回退用的 tag：${{ github.sha }}"
