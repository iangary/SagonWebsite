# 正式環境。原始碼不掛載，web 跑 Next.js standalone server。
#
# image 由 CI 預先建好推到 registry，主機端只 pull 不 build ——
# 4GB 的機器跑不動 next build 的尖峰（3-4GB），在這裡 build 會 OOM。
#
# 主機端需要兩個環境變數檔：
#   .env             給 compose 本身做 ${VAR} 替換（IMAGE_*、POSTGRES_*、SITE_DOMAIN）
#   .env.production  給容器內的應用程式（APP_URL、綠界金鑰等全部）
# 兩者缺一不可 —— env_file 不會被拿來做 compose 的變數替換。
name: sagon-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    # 對外只開 80/443，其餘服務一律不發佈連接埠
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      web: { condition: service_healthy }

  db:
    image: postgres:18-alpine
    restart: always
    # 預設值是給大機器的。這台 4GB 要同時養 web/worker/redis，收斂到這個量級。
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - work_mem=8MB
      # web 與 worker 各自開連線池，不設上限會在尖峰把記憶體吃光
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
      TZ: Asia/Taipei
    volumes:
      # PG18 起掛 /var/lib/postgresql，見 dev compose 的說明
      - pgdata:/var/lib/postgresql
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: always
    # maxmemory-policy 必須是 noeviction —— BullMQ 的硬性要求。
    # 用 LRU 之類的淘汰策略時，記憶體滿了 Redis 會丟掉鍵值，而那些鍵值就是
    # 待處理的工作：訂單付了款、webhook 也回了 200，但收據沒開、物流單沒建，
    # 而且日誌上不會有任何錯誤。
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    mem_limit: 320m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # 一次性容器：套用 migration 後結束。web 與 worker 都等它成功才啟動，
  # 確保程式碼跑起來時 schema 一定是最新的。
  migrate:
    image: ${IMAGE_PREFIX:?required}-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    env_file: .env.production
    mem_limit: 512m
    depends_on:
      db: { condition: service_healthy }

  web:
    image: ${IMAGE_PREFIX:?required}-web:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    # 只綁本機供除錯用；對外流量一律經過 caddy。
    # 注意 Docker 發佈連接埠會繞過 UFW（規則寫在 DOCKER-USER 鏈，順序在 ufw 前面），
    # 所以這裡若寫成 0.0.0.0 等於整個站裸奔在 3000 埠。
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - uploads:/app/public/uploads
      # 黑貓託運單 PDF。worker 寫、web 讀，所以兩邊都要掛同一個 volume。
      - labels:/app/storage/labels
    mem_limit: 1g
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${IMAGE_PREFIX:?required}-worker:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    # 不掛 uploads：商品圖片只在 admin 的 server action 裡處理，worker 不碰。
    # 但 labels 一定要掛 —— 建黑貓託運單是 worker 做的，PDF 由它寫入；
    # 而讀取是 web 的 /api/admin/labels 做的。少掛這個 volume，
    # PDF 會寫進 worker 容器的暫時層，web 永遠讀不到，而且黑貓的下載連結
    # 只有 24 小時，過期就補印不回來了。
    volumes:
      - labels:/app/storage/labels
    mem_limit: 768m
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  uploads:
  labels:
  caddy_data:
  caddy_config:
